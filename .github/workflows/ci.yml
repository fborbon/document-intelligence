name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  validate-html:
    name: Validate static demo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check static/index.html exists
        run: test -f static/index.html && echo "OK"

      - name: Check no external CDN links
        run: |
          if grep -E 'cdn\.|fonts\.googleapis|unpkg\.com|jsdelivr' static/index.html; then
            echo "External CDN links found — page must be self-contained"
            exit 1
          fi
          echo "Self-contained: OK"
